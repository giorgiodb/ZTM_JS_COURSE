<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA Pictures</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="https://s2.googleusercontent.com/s2/favicons?domain=www.nasa.gov">
</head>
<body>
    <!-- Loader -->
    <div class="loader hidden">
        <img src="rocket.svg" alt="Rocket loading Animation">
    </div>
    <!-- Container -->
    <div class="container">
        <div class="navigation-container">
            <span class="background"></span>
            <span class="navigation-items" id="resultsNav">
                <h3 class="clickable" onclick="updateDOM('favorites')">Favorites</h3>
                <h3>&nbsp;&nbsp;&nbsp;•&nbsp;&nbsp;&nbsp;</h3>
                <h3 class="clickable" onclick="getNasaImages()">Load More</h3>
            </span>
            <span class="navitation-items hidden" id="favoritesNav">
                <h3 class="clickable" onclick="updateDOM('results')">Back to images</h3>
            </span>
        </div>
        <!-- Images card -->
        <div class="images-container"></div>
    </div>
    <!-- Save -->
    <div class="save-confirmed" hidden>
        <h1>ADDED!</h1>
    </div>
    <!-- Script -->
    <script src="script.js"></script>
    <script src="../config.js"></script>
</body>
</html>
