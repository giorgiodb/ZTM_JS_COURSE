<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splash Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="wrapper">
        <img class="brand-img" src="./img/habitual-branding.png" alt="Habitual Logo">

        <div class="background-toggles" title="Change Background">
            <div class="background-1" value="1"></div>
            <div class="background-2" value="2"></div>
            <div class="background-3" value="3"></div>
        </div>

        <div class="text-container">
            <h1 class="title">Find the stuff you'll love.</h1>
            <p class="text">Aliquam rhoncus pretium dolor volutpat lectus odio non tellus neque. Aliquet et purus nibh
                bibendum integer etiam in enim nisi.</p>
            <div class="app-store-btn">
                <a href="https://apple.com" target="_blank">
                    <img src="img/app-store-button.png" alt="App Store">
                </a>
            </div>
            <div class="google-play-btn">
                <a href="https://play.google.com" target="_blank">
                    <img src="img/google-play-button.png" alt="Google Play">
                </a>
            </div>
        </div>

        <div class="main-image-container">
            <img src="img/main-image.png" alt="Landing Page Mockup">
        </div>
        
        <img class="profile-img" src="img/profile.png" alt="Profile Mockup">
        <img class="orders-img" src="img/orders.png" alt="Orders Mockup">
        <img class="home-img" src="img/home.png" alt="Home Mockup">
        <img class="cart-img" src="img/cart.png" alt="Cart Mockup">
        <img class="product-img" src="img/product.png" alt="Product Mockup">
    </div>

    <!-- Script -->
    <script src="script.js"></script>
</body>

</html>
